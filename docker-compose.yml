version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: books_db
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d books"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    container_name: books_scraper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: books
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./output:/app/output

volumes:
  postgres_data: